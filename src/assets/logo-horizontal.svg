<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="25%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#F0D080"/>
      <stop offset="75%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="goldMetal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A07830"/>
      <stop offset="35%" stop-color="#C9A84C"/>
      <stop offset="60%" stop-color="#F0D080"/>
      <stop offset="80%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A07830"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A07830"/>
      <stop offset="30%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#F0D080"/>
      <stop offset="70%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A07830"/>
    </linearGradient>
  </defs>

  <rect width="600" height="200" fill="#0A0A0A"/>

  <!-- Small emblem on left -->
  <g id="ring" transform="translate(0,0)">
    <circle cx="100" cy="100" r="65" fill="none" stroke="url(#goldMetal2)" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="url(#goldMetal)" stroke-width="1"/>
  </g>

  <g id="crown" fill="url(#goldMetal)" stroke="url(#goldMetal2)" stroke-width="0.4">
    <rect x="78" y="108" width="44" height="2" rx="0.5"/>
    <polygon points="81,108 84,88 89,100 100,72 111,100 116,88 119,108"/>
    <circle cx="84" cy="86" r="2"/>
    <circle cx="100" cy="70" r="2.5"/>
    <circle cx="116" cy="86" r="2"/>
  </g>

  <g id="stars" fill="#F0D080">
    <polygon points="58,96 59.5,92 61,96 65,97.5 61,99 59.5,103 58,99 54,97.5" opacity="0.7" transform="scale(0.8) translate(10,12)"/>
    <polygon points="138,96 139.5,92 141,96 145,97.5 141,99 139.5,103 138,99 134,97.5" opacity="0.7" transform="scale(0.8) translate(28,12)"/>
  </g>

  <line x1="75" y1="116" x2="125" y2="116" stroke="url(#goldText)" stroke-width="0.5" opacity="0.4"/>

  <text x="100" y="130" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="5.5" font-weight="300" letter-spacing="3" fill="url(#goldText)" opacity="0.5">EST. MMXXV</text>

  <!-- Wordmark to the right -->
  <g id="wordmark">
    <text x="200" y="88" font-family="'Times New Roman', 'Georgia', serif" font-size="34" font-weight="400" letter-spacing="10" fill="url(#goldText)">PLATINUM</text>
    <text x="200" y="122" font-family="'Times New Roman', 'Georgia', serif" font-size="22" font-weight="400" letter-spacing="12" fill="url(#goldText)">CIRCLE</text>
  </g>

  <!-- Tagline separator -->
  <line x1="200" y1="138" x2="340" y2="138" stroke="#C9A84C" stroke-width="0.5" opacity="0.3"/>

  <!-- Tagline -->
  <g id="tagline">
    <text x="200" y="156" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="9" font-weight="300" letter-spacing="7" fill="#E8E8E8" opacity="0.6">CONCIERGE</text>
  </g>
</svg>