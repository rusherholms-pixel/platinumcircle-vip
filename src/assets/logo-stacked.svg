<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="goldMetal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="25%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#F0D080"/>
      <stop offset="75%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="goldMetal2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A07830"/>
      <stop offset="35%" stop-color="#C9A84C"/>
      <stop offset="60%" stop-color="#F0D080"/>
      <stop offset="80%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A07830"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A07830"/>
      <stop offset="30%" stop-color="#C9A84C"/>
      <stop offset="50%" stop-color="#F0D080"/>
      <stop offset="70%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A07830"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="#0A0A0A"/>

  <!-- Emblem -->
  <g id="ring">
    <circle cx="200" cy="160" r="105" fill="none" stroke="url(#goldMetal2)" stroke-width="3.5"/>
    <circle cx="200" cy="160" r="98" fill="none" stroke="url(#goldMetal)" stroke-width="1.2"/>
  </g>

  <g id="crown" fill="url(#goldMetal)" stroke="url(#goldMetal2)" stroke-width="0.5">
    <rect x="170" y="175" width="60" height="2.5" rx="1"/>
    <polygon points="174,175 178,148 184,163 200,125 216,163 222,148 226,175"/>
    <circle cx="178" cy="146" r="2.5"/>
    <circle cx="200" cy="122" r="3.5"/>
    <circle cx="222" cy="146" r="2.5"/>
  </g>

  <g id="stars" fill="#F0D080">
    <polygon points="140,155 142,150 144,155 149,157 144,159 142,164 140,159 135,157" opacity="0.75"/>
    <polygon points="256,155 258,150 260,155 265,157 260,159 258,164 256,159 251,157" opacity="0.75"/>
  </g>

  <line x1="160" y1="185" x2="240" y2="185" stroke="url(#goldText)" stroke-width="0.6" opacity="0.5"/>

  <text x="200" y="205" text-anchor="middle" font-family="'Times New Roman', 'Georgia', serif" font-size="14" font-weight="400" letter-spacing="5" fill="url(#goldText)" opacity="0.6">EST. MMXXV</text>

  <!-- Stacked wordmark below emblem -->
  <g id="wordmark">
    <text x="200" y="330" text-anchor="middle" font-family="'Times New Roman', 'Georgia', serif" font-size="36" font-weight="400" letter-spacing="12" fill="url(#goldText)">PLATINUM</text>
    <text x="200" y="370" text-anchor="middle" font-family="'Times New Roman', 'Georgia', serif" font-size="24" font-weight="400" letter-spacing="14" fill="url(#goldText)">CIRCLE</text>
  </g>

  <!-- Tagline separator -->
  <line x1="140" y1="392" x2="260" y2="392" stroke="#C9A84C" stroke-width="0.5" opacity="0.35"/>

  <!-- Tagline -->
  <g id="tagline">
    <text x="200" y="415" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-size="10" font-weight="300" letter-spacing="8" fill="#E8E8E8" opacity="0.65">CONCIERGE</text>
  </g>
</svg>